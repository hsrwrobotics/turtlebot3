name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/turtlebot3
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            REBUILD_AT=${{ github.run_id }}
            LDS_MODEL=LDS-01
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.ros_distro }}
            ${{ env.IMAGE }}:${{ matrix.ros_distro }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.ros_distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ros_distro }}
          provenance: false
